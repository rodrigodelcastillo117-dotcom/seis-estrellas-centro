<script type="module">

const SOLIDOS = []; const solido = (x, z, w, d) => SOLIDOS.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 });

const W = 30, D = 26;

caja(.3, 4.6, D, '#241a38', -W / 2, 2.3, 0); caja(.3, 4.6, D, '#241a38', W / 2, 2.3, 0);

SOLIDOS.push({ minX: -99, maxX: 99, minZ: -99, maxZ: -D / 2 + .7 }, { minX: -99, maxX: 99, minZ: D / 2 - .7, maxZ: 99 }, { minX: -99, maxX: -W / 2 + .7, minZ: -99, maxZ: 99 }, { minX: W / 2 - .7, maxX: 99, minZ: -99, maxZ: 99 });

function lienzo(w, h) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8; return { cv, g: cv.getContext('2d'), tx }; }
{ const L = lienzo(1024, 256); const g = L.g; g.textAlign = 'center'; g.font = '900 120px Inter, Arial'; g.shadowColor = '#ff2e88'; g.shadowBlur = 30; g.fillStyle = '#ff9a2e'; g.fillText('SEIS ESTRELLAS', 512, 140); g.shadowBlur = 0; g.font = '700 40px Inter, Arial'; g.fillStyle = '#f4eefb'; g.fillText('★ ★ ★ ★ ★ ★   GTA 6 EN ESPAÑOL', 512, 215); L.tx.needsUpdate = true;
  const neo = new THREE.Mesh(new THREE.PlaneGeometry(7, 1.75), new THREE.MeshBasicMaterial({ map: L.tx, transparent: true, toneMapped: false })); neo.position.set(0, 3.2, D / 2 - .25); neo.rotation.y = Math.PI; scene.add(neo); }
caja(4.6, 1.05, 1.1, M('#ff2e88', .4), 0, .52, D / 2 - 2.4); solido(0, D / 2 - 2.4, 4.6, 1.1); caja(4.6, .06, 1.2, M('#f4eefb', .3), 0, 1.08, D / 2 - 2.4);
function planta(x, z, s = 1) { const m = new THREE.Mesh(new THREE.CylinderGeometry(.3 * s, .24 * s, .6 * s, 14), M('#7a5229')); m.position.set(x, .3 * s, z); m.castShadow = true; scene.add(m); for (let i = 0; i < 3; i++) { const h = new THREE.Mesh(new THREE.IcosahedronGeometry(.42 * s, 0), M('#2f8f4e', .9)); h.position.set(x + (i - 1) * .18 * s, (1 + i * .25) * s, z + (i % 2) * .12); h.castShadow = true; scene.add(h); } solido(x, z, .7 * s, .7 * s); }
[[-14, -12], [14, -12], [-14, 12], [14, 12], [-10, -12], [10, -12], [-14, 8], [14, 8]].forEach(p => planta(...p));
caja(3.4, .45, 1.1, M('#ff9a2e', .8), -10, .25, 11.2); caja(3.4, .7, .25, M('#ff9a2e', .8), -10, .6, 11.8); caja(1.4, .35, .8, M('#a0703c'), -10, .2, 10); solido(-10, 11, 3.6, 2.4);
caja(2.6, .95, .8, '#a0703c', 10.5, .48, 11.5); solido(10.5, 11.5, 2.6, .8); caja(.55, .65, .5, '#1a1a1a', 11.2, 1.28, 11.5); caja(.2, .22, .2, '#f4eefb', 10.2, 1.06, 11.5);

// ---------- pantallas grandes ----------
function pantallaGrande(w, h, x, y, z, ry, tipo) {
  const L = lienzo(2048, Math.round(2048 * h / w));
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: L.tx, toneMapped: false }));
  m.position.set(x, y, z); m.rotation.y = ry; m.userData = { tipo }; scene.add(m);
  const marco = new THREE.Mesh(new THREE.BoxGeometry(w + .25, h + .25, .08), M('#0b0614', .4)); marco.position.copy(m.position); marco.rotation.y = ry; marco.translateZ(-.06); scene.add(marco);
  return { L, m, w: 2048, h: L.cv.height };
}
const OPS = pantallaGrande(9, 4.2, 0, 2.55, -D / 2 + .3, 0, 'ops');
const TAB = pantallaGrande(9.5, 4.2, -W / 2 + .3, 2.55, -4, Math.PI / 2, 'tablero');
const BRD = pantallaGrande(9.5, 4.2, W / 2 - .3, 2.55, -4, -Math.PI / 2, 'board');
const COL = { YouTube: '#ff4d4d', Instagram: '#f06ba8', Facebook: '#6aa6ff', TikTok: '#25f4ee' };
function rr(g, x, y, w, h, r, fill) { g.beginPath(); g.roundRect(x, y, w, h, r); g.fillStyle = fill; g.fill(); }

function cabecera(g, w, h, titulo, sub) { g.fillStyle = '#0d0718'; g.fillRect(0, 0, w, h); const gr = g.createLinearGradient(0, 0, w, 0); gr.addColorStop(0, '#ff2e88'); gr.addColorStop(1, '#ff9a2e'); g.fillStyle = gr; g.fillRect(0, 0, w, 10); g.fillStyle = '#ff9a2e'; g.font = '900 76px Inter, Arial'; g.textAlign = 'left'; g.fillText(titulo, 60, 108); g.fillStyle = '#b3a5cc'; g.font = '500 32px Inter, Arial'; g.fillText(sub, 60, 156); }
function pintarOps() {
  const { g, tx } = OPS.L, w = OPS.w, h = OPS.h; cabecera(g, w, h, 'CENTRO DE OPERACIONES', 'Lo próximo que sale en las 4 redes · hora del centro de México · ' + fmt.format(new Date()));
  const px = OF.proximas || [];
  px.slice(0, 11).forEach((it, i) => { const y = 236 + i * 64; rr(g, 50, y - 44, w - 100, 56, 12, i % 2 ? '#160d28' : '#1c1230'); g.fillStyle = '#f4eefb'; g.font = '700 30px Inter, Arial'; g.fillText(fmt.format(new Date(it.cuando)), 75, y - 6); rr(g, 520, y - 36, 200, 42, 21, COL[it.red] || '#888'); g.fillStyle = '#120a1f'; g.font = '800 25px Inter, Arial'; g.fillText(it.red, 545, y - 7); g.fillStyle = '#f4eefb'; g.font = '500 29px Inter, Arial'; g.fillText((it.t || '').slice(0, 72), 745, y - 6); });

function pintarTablero() {

  const redes = ['YouTube', 'Instagram', 'Facebook', 'TikTok'], tw = (w - 120 - 90) / 4;

    g.fillStyle = '#f4eefb'; g.font = '900 100px Inter, Arial'; g.fillText(N(k.seguidores), x + 24, y + 168); g.fillStyle = '#b3a5cc'; g.font = '600 26px Inter, Arial'; g.fillText(r === 'YouTube' ? 'suscriptores' : 'seguidores', x + 24, y + 204);
    g.fillStyle = '#f4eefb'; g.font = '800 42px Inter, Arial'; g.fillText(N(k.vistas) + ' vistas', x + 24, y + 264); g.fillStyle = '#b3a5cc'; g.font = '600 24px Inter, Arial'; g.fillText(N(k.publicados) + ' publicados' + (k.programados != null ? ' · ' + N(k.programados) + ' en cola' : ''), x + 24, y + 304); });
  g.fillStyle = '#ff9a2e'; g.font = '800 36px Inter, Arial'; g.fillText('CAMINO A MONETIZAR', 60, 580);
  (OF.monetizacion || []).forEach((m, i) => { const y = 610 + i * 62, p = Math.max(0, Math.min(1, (m.actual || 0) / m.objetivo)); g.fillStyle = '#f4eefb'; g.font = '600 28px Inter, Arial'; g.fillText(m.red + ' · ' + m.meta, 60, y + 28); rr(g, 760, y + 4, 760, 30, 15, '#241840'); rr(g, 760, y + 4, Math.max(30, 760 * p), 30, 15, COL[m.red] || '#ff9a2e'); g.fillStyle = '#f4eefb'; g.font = '700 26px Inter, Arial'; g.fillText(N(m.actual) + ' / ' + N(m.objetivo) + '  (' + (p * 100).toFixed(p < .01 ? 2 : 1) + ' %)', 1540, y + 28); });

const AG_COL = { Rodrigo: '#ff9a2e', Claude: '#ff7a1a', Muse: '#2f7bff', ChatGPT: '#e8e8e8', Reportero: '#e04848', Marketing: '#ff2e88', Ventas: '#1fa35c', Cfo: '#9aa6b2', CFO: '#9aa6b2', Mejoras: '#8b5cf6', 'Mejora continua': '#8b5cf6', Coo: '#f5b700', COO: '#f5b700', Comunidad: '#00b8a9', Gameplay: '#84cc16', YouTube: '#ff4d4d', Instagram: '#f06ba8', Facebook: '#6aa6ff', TikTok: '#25f4ee' };
