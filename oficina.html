<style>
:root { --bg:#120a1f; --panel:#1c1230; --panel2:#241840; --line:#33244d; --fg:#f4eefb; --muted:#b3a5cc; --pink:#ff2e88; --orange:#ff9a2e; --cyan:#28dcff; --ok:#3ddc97; --bad:#ff5c7a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #6a3a9e; color: var(--fg); font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
canvas { display: block; }
.barra { position: fixed; z-index: 5; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#hud { left: 12px; top: max(12px, env(safe-area-inset-top)); right: 12px; }
.barra > a, .barra > span, .barra > button { background: rgba(255,255,255,.74); border: 1px solid rgba(255,255,255,.95); color: #2a1450; padding: 7px 12px; border-radius: 12px; font: 700 13px Inter, system-ui, sans-serif; text-decoration: none; cursor: pointer; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 4px 18px rgba(90,30,140,.18); }
.barra > button:hover, .barra > a:hover { border-color: var(--pink); background: #fff; }
#reloj { margin-left: auto; font-variant-numeric: tabular-nums; }
#vivo::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 8px var(--ok); }
#vivo.mal::before { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
#ayuda { transition: opacity .8s; position: fixed; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom)); background: rgba(255,255,255,.74); border: 1px solid rgba(255,255,255,.95); padding: 8px 14px; border-radius: 14px; font-size: 13px; color: #3a2066; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 4px 18px rgba(90,30,140,.18); z-index: 5; text-align: center; max-width: calc(100% - 32px); }
#cerca { position: fixed; left: 50%; top: 60%; transform: translateX(-50%); background: linear-gradient(90deg, #ff2e88, #ff9a2e); color: #fff; font-weight: 800; padding: 9px 16px; border-radius: 999px; z-index: 6; cursor: pointer; display: none; box-shadow: 0 6px 24px rgba(255,154,46,.35); }
#ficha { position: fixed; right: 12px; top: 64px; width: min(430px, calc(100% - 24px)); max-height: calc(100% - 140px); overflow: auto; background: rgba(30,16,62,.9); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 12px 40px rgba(40,10,80,.35); border: 1px solid var(--line); border-radius: 16px; padding: 16px; z-index: 7; display: none; user-select: text; -webkit-user-select: text; }
#ficha h3 { margin: 0; font-size: 24px; } #ficha .sub { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
#ficha .ahora { background: var(--panel2); border-radius: 10px; padding: 9px 11px; margin-bottom: 10px; }
#ficha h4 { margin: 12px 0 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--orange); }
#ficha ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 14px; } #ficha .f { color: var(--muted); font-size: 12px; } #ficha a { color: var(--cyan); }
#ficha .x { position: absolute; right: 10px; top: 8px; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
.op { display: grid; grid-template-columns: 120px 80px 1fr; gap: 6px; font-size: 13px; padding: 5px 0; border-top: 1px solid var(--line); } .op:first-child { border-top: 0; }
.red { font-size: 11px; font-weight: 700; border-radius: 999px; text-align: center; color: #120a1f; padding: 1px 6px; }
.YouTube { background: #ff4d4d; } .Instagram { background: #f06ba8; } .Facebook { background: #6aa6ff; } .TikTok { background: #25f4ee; }
#joy { position: fixed; left: max(18px, env(safe-area-inset-left)); bottom: max(64px, env(safe-area-inset-bottom)); width: 124px; height: 124px; border-radius: 50%; background: rgba(255,255,255,.28); border: 1px solid rgba(255,255,255,.75); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); z-index: 5; display: none; touch-action: none; }
#joy i { position: absolute; left: 37px; top: 37px; width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #ff5fc8, #ff9a2e); box-shadow: 0 0 18px rgba(255,95,200,.6); }
#login { position: fixed; inset: 0; display: none; place-items: center; z-index: 9; background: linear-gradient(180deg, #2a1b5e 0%, #7b3fa8 45%, #ff7eb6 80%, #ffb86b 100%); }
#login form { display: grid; gap: 12px; width: min(320px, 90%); text-align: center; }
#login input { padding: 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 18px; text-align: center; }
#login button { padding: 12px; border: 0; border-radius: 12px; font-weight: 700; background: linear-gradient(90deg, var(--pink), var(--orange)); color: #1a0a14; }
#carga { position: fixed; inset: 0; display: grid; place-items: center; z-index: 8; background: linear-gradient(180deg, #2a1b5e 0%, #7b3fa8 45%, #ff7eb6 80%, #ffb86b 100%); color: #fff; font-weight: 800; font-size: 18px; text-shadow: 0 2px 12px rgba(60,10,90,.5); }
#aviso { position: fixed; left: 12px; top: 60px; z-index: 5; display: none; align-items: center; gap: 8px; flex-wrap: wrap; max-width: min(820px, calc(100% - 24px)); background: rgba(22,10,38,.86); border: 1px solid #ffb02e; color: #ffe7b8; padding: 8px 10px; border-radius: 12px; font: 600 13px Inter, system-ui, sans-serif; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(60,10,90,.35); }
#aviso b { color: #ffb02e; } #aviso #avX { flex: 1 1 260px; color: #fff3dc; } #aviso #avN { color: #c9b6e6; font-size: 12px; }
#aviso button { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 8px; padding: 4px 10px; font: 700 12px Inter, system-ui, sans-serif; cursor: pointer; } #aviso button.ok { border-color: #3ddc97; color: #3ddc97; } #aviso button.no { border-color: #ff5c7a; color: #ff8fa3; }
@media (max-width: 640px) { #hud .nav { padding: 6px 9px; } #hud .nav span { display: none; } #reloj { display: none; } #vivo { font-size: 11px; padding: 6px 9px; } #aviso { font-size: 12px; padding: 7px 9px; gap: 6px; } #aviso #avX { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>

<body>
<div id="carga">Entrando a la oficina…</div>
<div id="hud" class="barra">
  <a href="/">← Panel</a>
  <button class="nav" id="aereoB" title="Vista aérea">🛰<span> Vista aérea</span></button><button class="nav" data-ir="equipo" title="Equipo">👥<span> Equipo</span></button><button class="nav" data-ir="tablero" title="Tablero">📊<span> Tablero</span></button><button class="nav" data-ir="board" title="Board">🗂<span> Board</span></button><button class="nav" data-ir="ops" title="Operaciones">📡<span> Operaciones</span></button>
  <span id="vivo">Conectando…</span><span id="reloj"></span>
</div>

<div id="aviso"><b id="avK">Espera tu OK:</b><span id="avX"></span><span id="avN"></span><button id="avVer">Ver</button><button id="avSig" class="ok">Siguiente</button><button id="avOc" class="no">Ocultar</button></div>
<div id="cerca"></div>
<div id="joy"><i></i></div>
<aside id="ficha" aria-live="polite"><button class="x" id="cerrar" aria-label="Cerrar">×</button><div id="fichaC"></div></aside>
<section id="login"><form id="lf"><h2 style="margin:0">Seis Estrellas</h2><input id="pw" type="password" inputmode="numeric" placeholder="Contraseña" aria-label="Contraseña"><button>Entrar</button><p id="le" style="color:var(--bad);margin:0;min-height:1.2em"></p></form></section>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const MOVIL = matchMedia('(pointer: coarse)').matches;
const TZ = 'America/Mexico_City';
const fmt = new Intl.DateTimeFormat('es-MX', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
const fmtH = new Intl.DateTimeFormat('es-MX', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
const nf = new Intl.NumberFormat('es-MX');
const N = v => (v === null || v === undefined || v === '') ? '—' : nf.format(v);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hace = iso => { if (!iso) return ''; const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000); return s < 90 ? 'hace segundos' : s < 5400 ? 'hace ' + Math.round(s / 60) + ' min' : s < 172800 ? 'hace ' + Math.round(s / 3600) + ' h' : 'hace ' + Math.round(s / 86400) + ' d'; };

// ---------- datos (se actualizan solos cada minuto) ----------
const KEY = 'seis-estrellas-centro-key';
let key = null; try { key = localStorage.getItem(KEY); } catch (e) {}
let DATOS = null, OF = {};
async function cargar() {
  if (!key) { document.getElementById('login').style.display = 'grid'; document.getElementById('carga').style.display = 'none'; return; }
  try {
    const r = await fetch('/api/stats', { headers: { 'x-panel-key': key }, cache: 'no-store' });
    if (r.status === 401) { try { localStorage.removeItem(KEY); } catch (e) {} key = null; document.getElementById('le').textContent = 'Contraseña incorrecta'; return cargar(); }
    DATOS = await r.json(); OF = DATOS.oficina || {};
    const v = document.getElementById('vivo'); v.className = ''; v.textContent = 'En vivo · datos ' + hace(OF.act_claude && OF.act_claude > (OF.act || '') ? OF.act_claude : OF.act);
    redibujar();
  } catch (e) { const v = document.getElementById('vivo'); v.className = 'mal'; v.textContent = 'Sin conexión · reintento en 1 min'; }
}
document.getElementById('lf').addEventListener('submit', e => { e.preventDefault(); key = document.getElementById('pw').value.trim(); try { localStorage.setItem(KEY, key); } catch (er) {} document.getElementById('login').style.display = 'none'; cargar(); });
setInterval(cargar, 60000);
setInterval(() => { document.getElementById('reloj').textContent = 'CDMX ' + fmtH.format(new Date()); }, 1000);

// ---------- motor ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOVIL ? 1.5 : 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#e64c9c'); scene.fog = new THREE.Fog('#e64c9c', 90, 470);
const camera = new THREE.PerspectiveCamera(MOVIL ? 72 : 64, innerWidth / innerHeight, 0.1, 700);
let composer = null;
if (!MOVIL) { composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera)); composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .5, .5, 1.02)); composer.addPass(new OutputPass()); }

const M = (c, r = .72, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
const NEON = (c, k = 2) => new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), toneMapped: false });
const BLANCO = new THREE.MeshPhysicalMaterial({ color: '#fbfaff', roughness: .3, clearcoat: .8, clearcoatRoughness: .15 });
const caja = (w, h, d, mat, x, y, z, sombra = true, padre = scene) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof mat === 'string' ? M(mat) : mat); o.position.set(x, y, z); o.castShadow = sombra; o.receiveShadow = true; padre.add(o); return o; };
const SOLIDOS = []; const solido = (x, z, w, d) => SOLIDOS.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 });
function lienzo(w, h) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8; return { cv, g: cv.getContext('2d'), tx }; }
let semilla = 20261119; const rnd = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;

// ---------- cielo: atardecer naranja-rosa-morado ----------
const SOL_DIR = new THREE.Vector3(-.2, .075, -1).normalize();
const CIELO_MAT = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { sol: { value: SOL_DIR } },
  vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `varying vec3 vD; uniform vec3 sol;
  void main(){
    vec3 d = normalize(vD); float h = d.y;
    float sh = max(dot(normalize(d.xz + 1e-5), normalize(sol.xz)), 0.);
    vec3 c0 = mix(vec3(1.0, .38, .60), vec3(1.0, .78, .24), pow(sh, 2.2));
    vec3 c1 = mix(vec3(.94, .26, .64), vec3(1.0, .50, .22), pow(sh, 1.8));
    vec3 c2 = mix(vec3(.78, .20, .70), vec3(1.0, .30, .52), pow(sh, 1.8));
    vec3 c3 = vec3(.50, .17, .70), c4 = vec3(.20, .08, .42);
    vec3 col = h < .07 ? mix(c0, c1, smoothstep(-.02, .07, h)) : h < .2 ? mix(c1, c2, smoothstep(.07, .2, h)) : h < .45 ? mix(c2, c3, smoothstep(.2, .45, h)) : mix(c3, c4, smoothstep(.45, 1., h));
    col = pow(col, vec3(2.2)) * 1.25;
    float s = max(dot(d, sol), 0.);
    col += vec3(1., .62, .25) * (pow(s, 6.) * .9 + pow(s, 70.) * 1.8) * (1. - smoothstep(-.05, .5, h) * .6);
    col = mix(col, vec3(2.4, 1.9, 1.1), smoothstep(.9972, .9978, s));
    gl_FragColor = vec4(col, 1.);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`
});
const cielo = new THREE.Mesh(new THREE.SphereGeometry(600, 64, 32), CIELO_MAT); cielo.renderOrder = -1; scene.add(cielo);
{ // reflejos del atardecer en todo lo brillante (piso espejo, cristal, plataformas)
  const pmrem = new THREE.PMREMGenerator(renderer); const es = new THREE.Scene(); es.add(new THREE.Mesh(new THREE.SphereGeometry(50, 48, 24), CIELO_MAT));
  scene.environment = pmrem.fromScene(es, .015, .1, 100).texture; pmrem.dispose(); }
function nube(ang, el, dist, s, sol) {
  const L = lienzo(512, 256), g = L.g;
  for (let i = 0; i < 11; i++) { const x = 70 + rnd() * 370, y = 120 + rnd() * 50 - (Math.abs(x - 256) < 120 ? 30 : 0), r = 36 + rnd() * 64; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, sol ? 'rgba(255,214,150,.85)' : 'rgba(255,170,220,.7)'); gr.addColorStop(.6, sol ? 'rgba(255,150,120,.32)' : 'rgba(230,110,210,.25)'); gr.addColorStop(1, 'rgba(255,140,200,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  L.tx.needsUpdate = true;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: L.tx, fog: false, depthWrite: false, transparent: true, opacity: .9 }));
  sp.scale.set(s * 2, s, 1); sp.position.set(Math.sin(ang) * dist, Math.tan(el) * dist, -Math.cos(ang) * dist); scene.add(sp);
}
{ const aSol = Math.atan2(SOL_DIR.x, -SOL_DIR.z);
  for (let i = 0; i < 7; i++) nube(aSol + (rnd() - .5) * 1.6, .03 + rnd() * .14, 360, 70 + rnd() * 60, true);
  for (let i = 0; i < 12; i++) nube(rnd() * Math.PI * 2, .05 + rnd() * .22, 380, 80 + rnd() * 70, false); }

// ---------- afuera: mar, reflejo del sol, skyline ----------
const BASE_Y = -14;
const mar = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), new THREE.MeshBasicMaterial({ color: '#8a2a8e' })); mar.rotation.x = -Math.PI / 2; mar.position.y = BASE_Y; scene.add(mar);
{ const L = lienzo(64, 512), g = L.g; const gx = g.createLinearGradient(0, 0, 64, 0); gx.addColorStop(0, 'rgba(255,190,110,0)'); gx.addColorStop(.5, 'rgba(255,220,150,1)'); gx.addColorStop(1, 'rgba(255,190,110,0)'); g.fillStyle = gx; g.fillRect(0, 0, 64, 512);
  g.globalCompositeOperation = 'destination-out'; for (let y = 0; y < 512; y += 6) { g.fillStyle = 'rgba(0,0,0,' + (.25 + rnd() * .5) + ')'; g.fillRect(0, y, 64, 2 + rnd() * 3); }
  g.globalCompositeOperation = 'destination-in'; const gy = g.createLinearGradient(0, 0, 0, 512); gy.addColorStop(0, 'rgba(0,0,0,1)'); gy.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gy; g.fillRect(0, 0, 64, 512); L.tx.needsUpdate = true;
  const grp = new THREE.Group(); grp.rotation.y = Math.atan2(-SOL_DIR.x, -SOL_DIR.z); scene.add(grp);
  const ref = new THREE.Mesh(new THREE.PlaneGeometry(40, 470), new THREE.MeshBasicMaterial({ map: L.tx, transparent: true, opacity: .85, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, toneMapped: false }));
  ref.rotation.x = -Math.PI / 2; ref.position.set(0, BASE_Y + .05, -300); grp.add(ref); }
{ const L = lienzo(128, 256), g = L.g; g.fillStyle = '#4a1d6e'; g.fillRect(0, 0, 128, 256);
  for (let y = 8; y < 250; y += 15) for (let x = 7; x < 124; x += 13) { const r = rnd(); g.fillStyle = r < .3 ? '#ffd29a' : r < .42 ? '#ff8fd6' : r < .5 ? '#8fe6ff' : '#5e2a8a'; g.fillRect(x, y, 8, 9); }
  L.tx.wrapS = L.tx.wrapT = THREE.RepeatWrapping; L.tx.repeat.set(2, 3); L.tx.needsUpdate = true;
  const EDIF = new THREE.MeshBasicMaterial({ map: L.tx, color: '#f2c4ff' }), TOPES = [NEON('#ff4fb8', 1.6), NEON('#4fe3ff', 1.6), NEON('#ffb02e', 1.6)];
  const sx = SOL_DIR.x, sz = SOL_DIR.z, sl = Math.hypot(sx, sz);
  for (let i = 0; i < 95; i++) {
    const ang = rnd() * Math.PI * 2, r = 80 + rnd() * 150, dx = Math.sin(ang), dz = Math.cos(ang);
    if ((dx * sx + dz * sz) / sl > .62) continue;
    const w = 7 + rnd() * 12, dd = w * (.6 + rnd() * .6), h = 18 + rnd() * 52;
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, dd), EDIF); b.position.set(dx * r, BASE_Y + h / 2, dz * r); b.rotation.y = rnd() * Math.PI; scene.add(b);
    if (rnd() < .35) { const t = new THREE.Mesh(new THREE.BoxGeometry(w * 1.02, .7, dd * 1.02), TOPES[i % 3]); t.position.set(0, h / 2 - 1.2, 0); b.add(t); }
  }
}

// ---------- edificio: pabellón de cristal ----------
const W = 30, D = 26, H = 4.6, HG = 10.6;                                                                // H: muros de pantallas · HG: cristal
const PISO = new THREE.MeshPhysicalMaterial({ color: '#2a0d3e', roughness: .17, metalness: .35, specularIntensity: .5, clearcoat: .25, clearcoatRoughness: .25 });
const piso = new THREE.Mesh(new THREE.BoxGeometry(W, .2, D), PISO); piso.position.y = -.1; piso.receiveShadow = true; scene.add(piso);
{ const J = M('#4a1c62', .4); for (let i = -W / 2 + 2; i < W / 2; i += 2) caja(.025, .004, D, J, i, .002, 0, false); for (let k = -D / 2 + 2; k < D / 2; k += 2) caja(W, .004, .025, J, 0, .002, k, false); }
caja(W + 10, .2, D + 10, new THREE.MeshPhysicalMaterial({ color: '#341345', roughness: .25, clearcoat: .6 }), 0, -.12, 0, false);   // terraza
const VIDRIO = new THREE.MeshPhysicalMaterial({ color: '#ffe0f2', roughness: .04, metalness: .05, transparent: true, opacity: .06, envMapIntensity: .8, depthWrite: false, side: THREE.DoubleSide });
const MARCO = M('#2a1240', .35, .6);
function muroCristal(largo, x, z, ry) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  const v = new THREE.Mesh(new THREE.PlaneGeometry(largo, HG), VIDRIO); v.position.y = HG / 2; v.renderOrder = 2; g.add(v);
  const n = Math.round(largo / 3.4); for (let i = 0; i <= n; i++) caja(.07, HG, .1, MARCO, -largo / 2 + i * largo / n, HG / 2, 0, true, g);
  caja(largo, .12, .14, MARCO, 0, .06, 0, false, g); caja(largo, .12, .14, MARCO, 0, HG - .06, 0, false, g);
  caja(largo, .03, .05, NEON('#6fe8ff', 2), 0, .03, .11, false, g);                                    // neón cian en la base

  if (!mejor) { if (yo.z < -D / 2 + 5 && Math.abs(yo.x) < 6) mejor = 'ops'; else if (yo.x < -W / 2 + 6 && yo.z < 2) mejor = 'tablero'; else if (yo.x > W / 2 - 6 && yo.z < 2) mejor = 'board'; }
  const c = document.getElementById('cerca');
  if (mejor) { c.dataset.id = mejor; c.textContent = gente[mejor] ? 'Ver qué hace ' + gente[mejor].p.nombre : ({ ops: 'Abrir el centro de operaciones', tablero: 'Abrir el tablero de números', board: 'Abrir el board del equipo' })[mejor]; c.style.display = 'block'; } else c.style.display = 'none';
  if (t - tPint > 30) { tPint = t; if (DATOS) pintarOps(); }
  if (composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
addEventListener('resize', () => { pintarAviso(); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); if (composer) composer.setSize(innerWidth, innerHeight); });
scene.traverse(o => { const m = o.material; if (!m || !m.isMeshStandardMaterial || m === VIDRIO) return; m.envMapIntensity = m === PISO ? 1.6 : m === PLAT ? 1.3 : .55; });
setTimeout(() => { const a = document.getElementById('ayuda'); a.style.opacity = '0'; setTimeout(() => { a.style.display = 'none'; }, 900); }, 14000);
redibujar(); loop(); document.getElementById('carga').style.display = 'none'; cargar();
</script>
